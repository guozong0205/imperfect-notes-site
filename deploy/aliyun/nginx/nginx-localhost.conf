# Localhost acceptance only. Bind 127.0.0.1:8870.
# Does not listen on 22, 80, 443, 3389, or 8765-8768.
# Does not include /etc/nginx/sites-enabled and does not start nginx.service.
# Pinned site commit: 082fd05c17711c8bdbdafbbf1218306e1d1a17e5

user www-data;
worker_processes 1;
worker_rlimit_nofile 2048;
pid /run/imperfectnotes-nginx.pid;
error_log /var/log/imperfectnotes/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/imperfectnotes/http-base.conf;

  server {
    listen 127.0.0.1:8870 default_server;
    server_name _;
    return 404;
  }

  server {
    listen 127.0.0.1:8870;
    server_name www.imperfectnotes.com;
    return 301 https://imperfectnotes.com$request_uri;
  }

  server {
    listen 127.0.0.1:8870;
    server_name imperfectnotes.com localhost 127.0.0.1;
    include /etc/imperfectnotes/site.conf;
  }
}
