# Public listeners. Install this only from 50-enable-public.sh after an
# explicit confirmation. Bind IPv4 :80 and :443 only.
# Does not listen on 22, 3389, 8870, or 8765-8768.
# Does not include /etc/nginx/sites-enabled and does not unmask nginx.service.
# Pinned site commit: 082fd05c17711c8bdbdafbbf1218306e1d1a17e5

user www-data;
worker_processes 1;
worker_rlimit_nofile 2048;
pid /run/imperfectnotes-nginx.pid;
error_log /var/log/imperfectnotes/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/imperfectnotes/http-base.conf;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:ImperfectNotesSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server {
    listen 80 default_server;
    server_name _;
    return 404;
  }

  server {
    listen 80;
    server_name imperfectnotes.com www.imperfectnotes.com;

    # HTTP-01 after cutover. Token files are not inside the release tree.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/imperfectnotes/acme;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 301 https://imperfectnotes.com$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name www.imperfectnotes.com;
    ssl_certificate     /etc/letsencrypt/live/imperfectnotes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imperfectnotes.com/privkey.pem;
    return 301 https://imperfectnotes.com$request_uri;
  }

  server {
    listen 443 ssl http2 default_server;
    server_name imperfectnotes.com;
    ssl_certificate     /etc/letsencrypt/live/imperfectnotes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imperfectnotes.com/privkey.pem;
    include /etc/imperfectnotes/site.conf;
  }
}
