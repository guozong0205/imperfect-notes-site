# Apex static site. Included inside the imperfectnotes.com server only.
# Pinned content: 082fd05c17711c8bdbdafbbf1218306e1d1a17e5
#
# Do not return 404 for /self or /ziwei. On current main, both exist:
#   /self/  is HTTP 200 and the page itself redirects to /
#   /ziwei/ is HTTP 200, the chart page
#   /self/self.css is used by /privacy/
# Directories without index.html (/assets/, /self/data/) are 404, matching
# GitHub Pages. They are not directory listings and not the homepage.

root /var/www/imperfectnotes/current;
index index.html;
autoindex off;

charset utf-8;
charset_types text/xml text/plain text/css text/markdown application/javascript application/json text/javascript image/svg+xml;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript text/markdown text/xml application/javascript application/json application/xml image/svg+xml;

add_header Access-Control-Allow-Origin "*" always;
add_header Cache-Control "public, max-age=600" always;

# GitHub Pages does not publish dotfiles. Keep /.well-known on port 80 only;
# this regex is not used by the HTTP ACME server.
location ~ /\. {
  return 404;
}

location / {
  try_files $uri $uri/ =404;
}

error_page 403 =404 /__imperfectnotes_404.html;
error_page 404 /__imperfectnotes_404.html;

location = /__imperfectnotes_404.html {
  internal;
  alias /etc/imperfectnotes/404.html;
  default_type text/html;
  charset utf-8;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control "no-store" always;
}
