# Shared http-context settings for the independent Imperfect Notes nginx.
# Included only by this site's own configs. Never included from /etc/nginx/nginx.conf.

include /etc/nginx/mime.types;
default_type application/octet-stream;
types {
  # Ubuntu 24.04 mime.types has no mjs or md. ES modules break if .mjs is
  # application/octet-stream. GitHub Pages serves .mjs as text/javascript and
  # .md as text/markdown. application/javascript is the nginx 1.24 equivalent
  # and is accepted as a module script. sitemap.xml stays text/xml from
  # mime.types; GitHub sends application/xml. A types block merges on 1.24.
  application/javascript mjs;
  text/markdown          md;
}

sendfile on;
tcp_nopush on;
tcp_nodelay on;
server_tokens off;
keepalive_timeout 65;
client_max_body_size 1m;

# Directory slash redirects stay on the same host and scheme (Location: /shop/).
# www -> apex is a separate absolute redirect. Do not send HSTS: a rollback to
# GitHub Pages must not be pinned in browsers.
absolute_redirect off;
port_in_redirect off;

client_body_temp_path /var/lib/imperfectnotes-nginx/client_body;
proxy_temp_path       /var/lib/imperfectnotes-nginx/proxy;
fastcgi_temp_path     /var/lib/imperfectnotes-nginx/fastcgi;
uwsgi_temp_path       /var/lib/imperfectnotes-nginx/uwsgi;
scgi_temp_path        /var/lib/imperfectnotes-nginx/scgi;

access_log /var/log/imperfectnotes/access.log;
